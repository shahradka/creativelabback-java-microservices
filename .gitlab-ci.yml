variables:
  DOCKER_TLS_CERTDIR: ''
  DOCKER_DRIVER: overlay2

stages:
  - build

services:
  - name: docker:24.0.5-dind
    alias: docker

build:
  stage: build
  image: docker:24.0.5
  rules:
    - if: '$CI_COMMIT_TAG =~ /^dev-\d+(\.\d+)*$/'
  before_script:
    - echo "Logging into Docker Hub..."
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - echo "🚀 Start building Docker image"
    # ✅ Create .env file with DB credentials from GitLab CI variables
    - echo "Creating .env file"
    - |
      cat <<EOF > .env
      DATABASE_URL=$DATABASE_URL
      DB_USERNAME=$DB_USERNAME
      DB_PASSWORD=$DB_PASSWORD
      EOF

    # ---- Build & Push to Docker Hub For Microservices Java repository ----
    - docker build -t $DOCKERHUB_USERNAME/creativelabbackend-microservices-java:${CI_COMMIT_SHA:0:8} .
    - docker push $DOCKERHUB_USERNAME/creativelabbackend-microservices-java:${CI_COMMIT_SHA:0:8}
    - docker tag $DOCKERHUB_USERNAME/creativelabbackend-microservices-java:${CI_COMMIT_SHA:0:8} $DOCKERHUB_USERNAME/creativelabbackend-microservices-java:latest
    - docker push $DOCKERHUB_USERNAME/creativelabbackend-microservices-java:latest
